<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app">
        <nav class="sideBar">
            <div class="upperNav">
                <div class="chickenNugget"><img src="assets/bubble.svg" height="40px" width="40px"></div>
                <div class="chickenNugget"><img src="assets/market.svg" height="40px" width="40px"></div>
                <div class="chickenNugget"><img src="assets/requests.svg" height="40px" width="40px"></div>
                <div class="chickenNugget"><img src="assets/archive.svg" height="40px" width="40px"></div>

            </div>
            <div class="lowerNav">
                <div class="mrKhen"><img src="assets/profile.svg" height="40px" width="40px"></div>
                <div class="mrKhen"><img src="assets/downthingy.svg" height="40px" width="40px"></div>
            </div>
        </nav>

        <aside class="cntcList">
            <header class="cntcListHeader">
                <div class="cntcListHeaderSpacer">
                    <h1>Chats</h1>
                    <div class="cntcListIcn">
                        <a href="https://facebook.com"><img src="assets/facebook.svg" height="50px" width="50px"></a>
                        <img src="assets/newChat.svg" height="50px" width="50px" class="newChat">
                    </div>
                </div>
                <div>
                    <input type="text" spellcheck="false" placeholder="Search Messages...">
                </div>
            </header>
            <main class="cntcPeople">
                <div class="cntcPerson">
                    <div class="cntcPersonImg">
                        <img src="assets/profile.svg" height="60px" width="60px">
                    </div>
                    <div class="cntcPersonInfo">
                        <h1>Name</h1>
                        <p>Start Messaging</p>
                    </div>
                </div>
            </main>
        </aside>

        <main class="mainChat">
            <div class="chatHeader">
                <div class="chatHeaderLeft">
                    <div>
                        <img src="assets/profile.svg" height="50px" width="50px">
                    </div>
                    <div>
                        <h1>Khen Weslie R. Hapis</h1>
                    </div>
                </div>
                <div class="chatHeaderRight">
                    <div class="action"><img src="assets/call.svg" height="40px" width="40px"></div>
                    <div class="action"><img src="assets/vc.svg" height="40px" width="40px"></div>
                    <div class="actionInfo"><img src="assets/info.svg" height="40px" width="40px"></div>
                </div>
            </div>
            <div class="outputSection">
            </div>
            <div class="inputSection">
                <input type="text" placeholder="Type a message...">
                <button><img src="assets/like.svg" height="40px" width="40px"></button>
            </div>
        </main>

        <aside class="info">
            <div class="infoCont">
                <div class="infoHeader">
                    <img src="assets/profile.svg" height="110px" width="110px">
                    <h1>Khen Weslie R. Hapis</h1>
                    <p>Active Now</p>
                    <div class="infoHeaderspcr">
                        <img src="assets/mute.svg" height="50px" width="50px">
                        <img src="assets/block.svg" height="50px" width="50px">
                    </div>
                </div>
                <div class="infoMain">
                    <div class="dropdown">
                        <h2>Chat Members</h2>
                        <h3>▽</h3>
                    </div>
                </div>
            </div>
        </aside>

        <div class="hider">
        <div class="joinChat">
            <input type="text" placeholder="Enter your name...">
            <button>Join Chat</button>
        </div>
        </div>

    </div>

</body>

</html>
