<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <nav class="sideBar">
            <div class="upperNav">
                <img src="assets/icon.png">
                <img src="assets/icon.png">
                <img src="assets/icon.png">
                <img src="assets/icon.png">
            </div>
            <div class="lowerNav">
                <img src="assets/icon.png">
                <img src="assets/icon.png">
            </div>
        </nav>

        <aside class="cntcList">
            <div class="cntcListHeader">
                <div class="cntcListHeaderSpacer">
                    <div>
                        <h1>Chats</h1>
                    </div>
                    <div class="cntcListIcn">
                        <img src="assets/icon.png">
                        <img src="assets/icon.png">
                    </div>
                </div>
                <div>
                    <input type="text" spellcheck="false" placeholder="Search Messages...">
                </div>
            </div>
        </aside>

        <main class="mainChat">
            <div class="chatHeader">
                <div class="chatHeaderLeft">
                    <div>
                        <img src="assets/icon.png">
                    </div>
                    <div>
                        <h1>Name</h1>
                    </div>
                </div>
                <div class="chatHeaderRight">
                    <img src="assets/icon.png">
                    <img src="assets/icon.png">
                    <img src="assets/icon.png">
                </div>
            </div>
            <div class="inputSection">
                <input type="text" placeholder="Type a message...">
                <img src="assets/icon.png">
            </div>
        </main>

        <aside class="cntcInfo">
            <div class="cntcInfoHeader">
                <div class="cntcInfoHeaderupper">
                    <img src="assets/icon.png">
                    <h1>Test</h1>
                </div>
                <div class="cntcInfoHeaderspcr">
                    <img src="assets/icon.png">
                    <img src="assets/icon.png">
                </div>
            </div>
        </aside>
    </div>
</body>

</html>
