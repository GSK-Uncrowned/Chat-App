<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app">
        <nav class="sideBar">
            <div class="upperNav">
                <img src="assets/bubble.svg" height="40px" width="40px">
                <img src="assets/market.svg" height="40px" width="40px">
                <img src="assets/requests.svg" height="40px" width="40px">
                <img src="assets/archive.svg" height="40px" width="40px">
            </div>
            <div class="lowerNav">
                <img src="assets/profile.svg" height="40px" width="40px">
                <img src="assets/downthingy.svg" height="40px" width="40px">
            </div>
        </nav>

        <aside class="cntcList">
            <header class="cntcListHeader">
                <div class="cntcListHeaderSpacer">
                    <h1>Chats</h1>
                    <div class="cntcListIcn">
                        <img src="assets/facebook.svg" height="40px" width="40px">
                        <img src="assets/newChat.svg" height="40px" width="40px">
                    </div>
                </div>
                <div>
                    <input type="text" spellcheck="false" placeholder="Search Messages...">
                </div>
            </header>
            <main class="cntcPeople">
                <div class="cntcPerson">
                    <div class="cntcPersonImg">
                        <img src="assets/icon.png" height="60px" width="60px">
                    </div>
                    <div class="cntcPersonInfo">
                        <h1>Name</h1>
                        <p>Last Message</p>
                    </div>
                </div>
            </main>
        </aside>

        <main class="mainChat">
            <div class="chatHeader">
                <div class="chatHeaderLeft">
                    <div>
                        <img src="assets/profile.svg" height="50px" width="50px">
                    </div>
                    <div>
                        <h1>Khen Weslie R. Hapis</h1>
                    </div>
                </div>
                <div class="chatHeaderRight">
                    <img src="assets/call.svg" height="40px" width="40px">
                    <img src="assets/vc.svg" height="40px" width="40px">
                    <img src="assets/info.svg" height="40px" width="40px">
                </div>
            </div>
            <div class="outputSection">
                <div class="incoming">
                    <p>This is an incoming message.</p>
                </div>
                <div class="outgoing">
                    <p>This is an outgoing message.</p>
                </div>
            </div>
            <div class="inputSection">
                <input type="text" placeholder="Type a message...">
                <img src="assets/send.svg" height="35px" width="35px">
            </div>
        </main>

        <aside class="info">
            <div class="infoHeader">
                <div class="infoHeaderUpper">
                    <img src="assets/profile.svg" height="110px" width="110px">
                    <h1>Khen Weslie R. Hapis</h1>
                    <p>Active Now</p>
                </div>
                <div class="infoHeaderspcr">
                    <img src="assets/mute.svg" height="50px" width="50px">
                    <img src="assets/block.svg" height="50px" width="50px">
                </div>
            </div>
            <div class="infoMain">
                <div class="dropdown">
                    <h2>Chat Members</h2>
                    <h3>▽</h3>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
